appId: com.bananasend.app
productName: Banana Send
copyright: Copyright © 2026 Banana Send
npmRebuild: false
buildDependenciesFromSource: false
extraMetadata:
  name: banana-send
  version: 1.0.0
  main: electron/main.cjs
directories:
  output: dist-windows
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
  - "!node_modules/**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Banana Send
portable:
  artifactName: Banana-Send-Portable.exe
